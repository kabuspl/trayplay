name: Build Release Packages

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            source_tag:
                description: "Existing v* tag to package (for example, v1.2.0)"
                required: true
                type: string

permissions:
    contents: write

env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.source_tag || github.ref_name }}

jobs:
    prepare-flatpak-manifest:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
                  fetch-depth: 0

            - name: Update Flatpak source tag
              run: |
                  sed -i "/^    - name: trayplay$/,/^$/ s/^\([[:space:]]*tag:[[:space:]]*\).*/\1${RELEASE_TAG}/" packaging/ovh.kabus.TrayPlay.yml

            - name: Commit updated Flatpak manifest
              if: github.event_name == 'push'
              uses: EndBug/add-and-commit@v9
              with:
                  add: "packaging/ovh.kabus.TrayPlay.yml"
                  message: "ci: bump Flatpak source to ${{ github.ref_name }}"
                  default_author: github_actions
                  push: origin main

    arch:
        needs: prepare-flatpak-manifest
        runs-on: ubuntu-latest

        container:
            image: archlinux:latest

        steps:
            - name: Install system dependencies
              run: |
                  pacman -Syu --noconfirm
                  pacman -S --noconfirm base-devel git sudo pacman-contrib

            - name: Create build user
              run: |
                  useradd -m builder
                  echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
                  fetch-depth: 0 # needed for pushing commits

            - name: Prepare PKGBUILD (version, checksums, SRCINFO)
              run: |
                  VERSION="${RELEASE_TAG#v}"

                  echo "Tag: $RELEASE_TAG"
                  echo "Version: $VERSION"

                  cd packaging

                  sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
                  sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

                  chown -R builder:builder .

                  sudo -u builder bash -c "
                    cd $PWD
                    sleep 5
                    updpkgsums
                    makepkg --printsrcinfo > .SRCINFO
                  "

            - name: Mark repo as safe for git
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Commit updated PKGBUILD
              if: github.event_name == 'push'
              uses: EndBug/add-and-commit@v9
              with:
                  add: "packaging/PKGBUILD"
                  message: "ci: bump version to ${{ github.ref_name }}"
                  default_author: github_actions
                  push: origin main

            - name: Prepare clean build dir
              run: |
                  mkdir -p /build
                  cp packaging/PKGBUILD /build
                  chown -R builder:builder /build

            - name: Build package
              run: |
                  sudo -u builder bash -c "
                    cd /build
                    makepkg -s --noconfirm --cleanbuild
                  "

            - name: Upload Arch package
              uses: actions/upload-artifact@v7
              with:
                  name: arch-package
                  path: "/build/*.pkg.tar.zst"

    flatpak:
        needs: prepare-flatpak-manifest
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

            - name: Set Flatpak source tag for this build
              run: |
                  sed -i "/^    - name: trayplay$/,/^$/ s/^\([[:space:]]*tag:[[:space:]]*\).*/\1${RELEASE_TAG}/" packaging/ovh.kabus.TrayPlay.yml

            - name: Install Flatpak build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes flatpak flatpak-builder
                  flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

            - name: Build Flatpak bundle
              run: |
                  VERSION="${RELEASE_TAG#v}"

                  flatpak-builder --force-clean --repo=repo --install-deps-from=flathub build-dir packaging/ovh.kabus.TrayPlay.yml
                  flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo repo "trayplay-${VERSION}.flatpak" ovh.kabus.TrayPlay

            - name: Upload Flatpak bundle
              uses: actions/upload-artifact@v7
              with:
                  name: flatpak-bundle
                  path: "trayplay-*.flatpak"

    release:
        needs:
            - arch
            - flatpak
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest

        steps:
            - name: Download release assets
              uses: actions/download-artifact@v7
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Create GitHub Release and upload packages
              uses: softprops/action-gh-release@v3
              with:
                  files: "release-assets/*"
